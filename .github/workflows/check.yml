# Every push and pull request: the safety gate (gitleaks over the whole history, the word
# checks over every tracked file), then the tests. Modeled on vapi-voice-tuneup's test.yml.
name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (the version on the owner's Mac), checked against a hash written here
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz. Read from the release's checksums file on 2026-11-04 and
          # matched against GitHub's own digest for the asset, which has not changed since 2026-03-21. Written
          # here, not fetched, so a release swapped later (file and checksums both) fails this step.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check
          tar -xzf "$tarball" gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/"
      - name: Safety gate
        run: bash scripts/gate.sh --all
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm test
